server:
  port: 8080

spring:
  profiles:
    active: dev

  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/your-realm
  config:
    import: "optional:configserver:"
  cloud:
    config:
      uri: http://localhost:8888