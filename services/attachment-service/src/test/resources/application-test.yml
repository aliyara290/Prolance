spring:
  application:
    name: attachment-service
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/test
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  cloud:
    config:
      enabled: false

aws:
  s3:
    access-key: test
    secret-key: test
    region: eu-west-1
    bucket-name: test-bucket

eureka:
  client:
    enabled: false
