server:
  port: 8080

spring:
  application:
    name: task-service
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://config-server.prolance.local:8888"
  cloud:
    config:
      uri: http://config-server.prolance.local:8888
      fail-fast: true
      retry:
        initial-interval: 2000
        max-interval: 10000
        max-attempts: 10
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
