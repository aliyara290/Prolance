server:
  port: 8080

spring:
  application:
    name: project-service
  profiles:
    active: dev
  config:
    import: "optional:configserver:http://config-server.prolance.local:8888"
  cloud:
    config:
      uri: http://config-server.prolance.local:8888
      fail-fast: true
      retry:
        initial-interval: 2000
        max-interval: 10000
        max-attempts: 10
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: project-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"